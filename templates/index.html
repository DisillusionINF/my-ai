<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 编程助手</title>

    <script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }

        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; max-width: 900px; width: 100%; margin: 0 auto; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-size: 16px; font-weight: 500; color: #666; border: none; background: none; transition: all 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn:hover { background: #f8f9fa; color: #333; }
        .tab-btn.active { color: #007bff; border-bottom-color: #007bff; }

        .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }

        #controls { padding: 10px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; gap: 15px; align-items: center; max-width: 900px; width: 100%; margin: 0 auto; font-size: 14px; flex-wrap: wrap; }
        #controls input[type="range"] { width: 120px; vertical-align: middle; margin-left: 5px; }
        #controls input[type="number"] { width: 80px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        #controls select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
        .message { margin-bottom: 20px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .bubble { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word; }
        .message.user .bubble { background: #007bff; color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        .bubble pre { position: relative; background: #282c34; color: #abb2bf; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: Consolas, monospace; font-size: 13px; }
        .copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 8px; font-size: 12px; color: #ddd; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; cursor: pointer; transition: all 0.2s; display: none; font-family: "Microsoft YaHei", sans-serif; z-index: 10; }
        .bubble pre:hover .copy-btn { display: block; }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.3); color: #fff; }
        .bubble p { margin-bottom: 10px; } .bubble p:last-child { margin-bottom: 0; }
        .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 8px 0; font-weight: 600; }
        .bubble ul, .bubble ol { padding-left: 22px; margin-bottom: 10px; } .bubble li { margin-bottom: 4px; }
        .bubble code { font-family: Consolas, monospace; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .bubble pre code { background: transparent; padding: 0; color: inherit; }
        .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .bubble th, .bubble td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; } .bubble th { background-color: #f7f7f7; }
        .bubble blockquote { border-left: 4px solid #007bff; padding-left: 12px; color: #555; margin: 10px 0; background: #f9f9f9; padding: 8px 12px; border-radius: 4px; }

        .reasoning-box {
            background: #f0f4f8;
            color: #666;
            font-size: 13px;
            font-style: italic;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #b3c6d9;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .reasoning-box::before { content: '💭 '; }

        .solution-raw { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; color: #333; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #e8e8e8; max-height: 600px; overflow-y: auto; }
        .copy-all-btn { display: inline-block; margin-bottom: 8px; padding: 6px 14px; font-size: 13px; color: #fff; background: #28a745; border: none; border-radius: 6px; cursor: pointer; height: auto; transition: background 0.2s; }
        .copy-all-btn:hover { background: #218838; }

        .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

        #input-area { display: flex; gap: 10px; padding: 15px 20px; background: #fff; border-top: 1px solid #e0e0e0; max-width: 900px; width: 100%; margin: 0 auto; align-items: flex-end; }
        #input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 10px; resize: none; font-size: 15px; font-family: inherit; outline: none; height: 52px; transition: border-color 0.2s; }
        #input:focus { border-color: #007bff; }
        button { padding: 0 24px; border: none; border-radius: 10px; background: #007bff; color: #fff; font-size: 15px; cursor: pointer; font-weight: 500; transition: background 0.2s; height: 52px; }
        button:hover { background: #0069d9; }
        button.clear { background: #6c757d; } button.clear:hover { background: #5a6268; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #upload-btn { background: #6c757d; padding: 0 15px; }
        #upload-btn:hover { background: #5a6268; }
        #stop-btn { background: #dc3545; display: none; }
        #stop-btn:hover { background: #c82333; }

        #preview-area { display: flex; gap: 10px; padding: 0 20px; max-width: 900px; width: 100%; margin: 0 auto; overflow-x: auto; }
        .preview-item { position: relative; margin-top: 10px; }
        .preview-item img { height: 60px; border-radius: 6px; border: 1px solid #ccc; }
        .preview-item .close-btn { position: absolute; top: -6px; right: -6px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; border: none; padding: 0; }

        #solution-input-area { display: flex; flex-direction: column; gap: 10px; padding: 15px 20px; background: #fff; border-top: 1px solid #e0e0e0; max-width: 900px; width: 100%; margin: 0 auto; }
        #solution-input { width: 100%; height: 150px; padding: 12px 16px; border: 1px solid #ccc; border-radius: 10px; resize: vertical; font-size: 15px; font-family: inherit; outline: none; }
        #solution-input:focus { border-color: #007bff; }
        #solution-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        #solution-stop-btn { background: #dc3545; display: none; }
        #solution-stop-btn:hover { background: #c82333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" data-tab="chat">💬 编程代码</button>
        <button class="tab-btn" data-tab="solution">📝 修正题解</button>
    </div>

    <div id="tab-chat" class="tab-content active">
        <div id="controls">
            <div>
                <label>模型:</label>
                <select id="model-choice">
                    <option value="agnes" selected>Agnes（快，推荐日常）</option>
                    <option value="kimi">Kimi K3（慢，强推理）</option>
                </select>
            </div>
            <div><label>温度: <span id="temp-value">0.2</span></label><input type="range" id="temp-slider" min="0" max="2" step="0.1" value="0.2"></div>
            <div><label>Max Tokens:</label><input type="number" id="max-tokens" value="16384" step="1024" min="256" max="65536"></div>
            <div id="reasoning-effort-container" class="hidden">
                <label>思考强度:</label>
                <select id="reasoning-effort">
                    <option value="low" selected>low（快）</option>
                    <option value="high">high（平衡）</option>
                    <option value="max">max（深度）</option>
                </select>
            </div>
        </div>
        <div id="chat-container"></div>
        <div id="preview-area"></div>
        <div id="input-area">
            <input type="file" id="file-upload" accept="image/*,.txt,.py,.cpp,.js,.md,.json" style="display: none;">
            <button id="upload-btn">📎 上传</button>
            <textarea id="input" placeholder="输入消息... (Ctrl+Enter 发送，支持粘贴图片)"></textarea>
            <button id="stop-btn">⏹ 停止生成</button>
            <button id="send">发送</button>
            <button id="clear" class="clear">清空</button>
        </div>
    </div>

    <div id="tab-solution" class="tab-content">
        <div id="chat-container-solution" style="flex:1; overflow-y:auto; padding:20px; max-width:900px; width:100%; margin:0 auto;"></div>
        <div id="solution-input-area">
            <textarea id="solution-input" placeholder="粘贴你的题解草稿... AI 将根据洛谷规范修正格式并返回源码"></textarea>
            <div id="solution-buttons">
                <button id="solution-stop-btn">⏹ 停止生成</button>
                <button id="solution-send">修正题解</button>
                <button id="solution-clear" class="clear">清空</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ================= 编程代码 =================
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const stopBtn = document.getElementById('stop-btn');
        const clearBtn = document.getElementById('clear');
        const tempSlider = document.getElementById('temp-slider');
        const tempValueSpan = document.getElementById('temp-value');
        const maxTokensInput = document.getElementById('max-tokens');
        const modelChoiceSelect = document.getElementById('model-choice');
        const reasoningContainer = document.getElementById('reasoning-effort-container');
        const reasoningEffortSelect = document.getElementById('reasoning-effort');
        const fileUpload = document.getElementById('file-upload');
        const uploadBtn = document.getElementById('upload-btn');
        const previewArea = document.getElementById('preview-area');
        let isSending = false;
        let pendingImages = [];
        let currentController = null;

        // 切换模型时显示/隐藏思考强度
        modelChoiceSelect.addEventListener('change', () => {
            if (modelChoiceSelect.value === 'kimi') {
                reasoningContainer.classList.remove('hidden');
            } else {
                reasoningContainer.classList.add('hidden');
            }
        });

        tempSlider.addEventListener('input', (e) => { tempValueSpan.textContent = e.target.value; });
        uploadBtn.addEventListener('click', () => fileUpload.click());

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => { pendingImages.push(ev.target.result); renderPreview(ev.target.result, pendingImages.length - 1); };
                reader.readAsDataURL(file);
            } else {
                const reader = new FileReader();
                reader.onload = (ev) => { input.value += "\n```\n" + ev.target.result + "\n```\n"; input.focus(); };
                reader.readAsText(file);
            }
            fileUpload.value = '';
        });

        input.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let hasImage = false;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    hasImage = true;
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (event) => { pendingImages.push(event.target.result); renderPreview(event.target.result, pendingImages.length - 1); };
                    reader.readAsDataURL(blob);
                }
            }
            if (hasImage) e.preventDefault();
        });

        function renderPreview(base64, index) {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `<img src="${base64}"><button class="close-btn" onclick="removeImage(${index})">×</button>`;
            previewArea.appendChild(div);
        }

        window.removeImage = function(index) {
            pendingImages.splice(index, 1);
            previewArea.innerHTML = '';
            pendingImages.forEach((img, i) => renderPreview(img, i));
        }

        function addCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn'; btn.textContent = '复制';
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const codeElement = pre.querySelector('code');
                    const textToCopy = codeElement ? codeElement.innerText : pre.innerText;
                    try { await navigator.clipboard.writeText(textToCopy); btn.textContent = '已复制!'; }
                    catch (err) { const textarea = document.createElement('textarea'); textarea.value = textToCopy; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); btn.textContent = '已复制!'; }
                    setTimeout(() => { btn.textContent = '复制'; }, 1500);
                };
                pre.appendChild(btn);
            });
        }

        function addMessage(role, content, images = []) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            images.forEach(img => {
                const imgEl = document.createElement('img');
                imgEl.src = img; imgEl.style.maxWidth = '200px'; imgEl.style.borderRadius = '8px'; imgEl.style.marginBottom = '8px'; imgEl.style.display = 'block';
                bubble.appendChild(imgEl);
            });
            if (content) {
                const textEl = document.createElement('div');
                if (typeof marked !== 'undefined') { textEl.innerHTML = marked.parse(content); if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise([textEl]).catch(() => {}); addCopyButtons(textEl); }
                else { textEl.textContent = content; }
                bubble.appendChild(textEl);
            }
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        async function sendMessage() {
            if (isSending) return;
            const text = input.value.trim();
            if (!text && pendingImages.length === 0) return;
            input.value = ''; isSending = true;
            sendBtn.disabled = true;
            stopBtn.style.display = 'inline-block';

            const imagesToSend = [...pendingImages];
            pendingImages = []; previewArea.innerHTML = '';

            addMessage('user', text, imagesToSend);

            const div = document.createElement('div');
            div.className = 'message assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const reasoningBox = document.createElement('div');
            reasoningBox.className = 'reasoning-box';
            reasoningBox.style.display = 'none';
            const contentBox = document.createElement('div');
            bubble.appendChild(reasoningBox);
            bubble.appendChild(contentBox);
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            let fullContent = '';
            let fullReasoning = '';

            currentController = new AbortController();
            const timeoutId = setTimeout(() => currentController.abort(), 1800000);   // 30 分钟

            try {
                let temp = parseFloat(tempSlider.value) || 0.2;
                let maxTokens = parseInt(maxTokensInput.value) || 16384;
                if (maxTokens < 256) maxTokens = 256;
                if (maxTokens > 65536) maxTokens = 65536;

                const modelChoice = modelChoiceSelect.value;
                const reasoningEffort = reasoningEffortSelect.value;

                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        temperature: temp,
                        max_tokens: maxTokens,
                        images: imagesToSend,
                        model: modelChoice,
                        reasoning_effort: reasoningEffort
                    }),
                    signal: currentController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        // 跳过 SSE 注释行（如心跳的 ": keep-alive"）
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') {
                            if (typeof marked !== 'undefined') {
                                contentBox.innerHTML = marked.parse(fullContent);
                                addCopyButtons(contentBox);
                            } else {
                                contentBox.textContent = fullContent;
                            }
                            if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise([contentBox]).catch(() => {});
                            break;
                        }
                        try {
                            const json = JSON.parse(data);
                            if (json.reasoning) {
                                fullReasoning += json.reasoning;
                                reasoningBox.style.display = 'block';
                                reasoningBox.textContent = fullReasoning;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } else if (json.content) {
                                fullContent += json.content;
                                contentBox.textContent = fullContent;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } else if (json.error) {
                                contentBox.innerHTML = '<span style="color:red;">系统错误: ' + json.error + '</span>';
                            }
                        } catch (e) {}
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    if (fullContent) {
                        if (typeof marked !== 'undefined') { contentBox.innerHTML = marked.parse(fullContent); addCopyButtons(contentBox); }
                        if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise([contentBox]).catch(() => {});
                        contentBox.innerHTML += '<div style="color:#999; margin-top:10px; font-size:13px;">[已停止生成]</div>';
                    } else {
                        contentBox.innerHTML = '<span style="color:#999;">[已停止生成]</span>';
                    }
                } else {
                    contentBox.textContent = '请求失败: ' + err.message;
                }
            } finally {
                clearTimeout(timeoutId);
                isSending = false;
                sendBtn.disabled = false;
                stopBtn.style.display = 'none';
                currentController = null;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
        stopBtn.addEventListener('click', () => { if (currentController) currentController.abort(); });
        clearBtn.addEventListener('click', async () => {
            if (!confirm('确定要清空所有历史记录吗？')) return;
            try { await fetch('/clear', { method: 'POST' }); chatContainer.innerHTML = ''; addMessage('assistant', '历史记录已清空。'); } catch (e) { alert('清空失败'); }
        });

        addMessage('assistant', '你好！我是 AI 助手。可以帮你写代码或修正题解。');
        input.focus();

        // ================= 修正题解 =================
        const solutionContainer = document.getElementById('chat-container-solution');
        const solutionInput = document.getElementById('solution-input');
        const solutionSendBtn = document.getElementById('solution-send');
        const solutionStopBtn = document.getElementById('solution-stop-btn');
        const solutionClearBtn = document.getElementById('solution-clear');
        let isSolutionSending = false;
        let solutionController = null;

        function addSolutionMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (content) {
                if (role === 'assistant') {
                    const pre = document.createElement('div');
                    pre.className = 'solution-raw';
                    pre.textContent = content;
                    bubble.appendChild(pre);
                } else {
                    const pre = document.createElement('div');
                    pre.className = 'solution-raw';
                    pre.style.background = 'transparent';
                    pre.style.border = 'none';
                    pre.style.padding = '0';
                    pre.textContent = content;
                    bubble.appendChild(pre);
                }
            }
            div.appendChild(bubble);
            solutionContainer.appendChild(div);
            solutionContainer.scrollTop = solutionContainer.scrollHeight;
            return bubble;
        }

        async function sendSolution() {
            if (isSolutionSending) return;
            const text = solutionInput.value.trim();
            if (!text) return;
            solutionInput.value = '';
            isSolutionSending = true;
            solutionSendBtn.disabled = true;
            solutionStopBtn.style.display = 'inline-block';

            addSolutionMessage('user', text);
            const bubble = addSolutionMessage('assistant', '正在根据洛谷规范修正格式');
            bubble.classList.add('loading-dots');
            let fullContent = '';

            solutionController = new AbortController();
            const timeoutId = setTimeout(() => solutionController.abort(), 900000);

            try {
                const response = await fetch('/solution', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text }),
                    signal: solutionController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let firstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') {
                            bubble.classList.remove('loading-dots');
                            bubble.innerHTML = '';
                            const copyAllBtn = document.createElement('button');
                            copyAllBtn.className = 'copy-all-btn';
                            copyAllBtn.textContent = '📋 复制全文';
                            copyAllBtn.onclick = async () => {
                                try { await navigator.clipboard.writeText(fullContent); copyAllBtn.textContent = '✅ 已复制!'; }
                                catch (err) { const textarea = document.createElement('textarea'); textarea.value = fullContent; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); copyAllBtn.textContent = '✅ 已复制!'; }
                                setTimeout(() => { copyAllBtn.textContent = '📋 复制全文'; }, 1500);
                            };
                            bubble.appendChild(copyAllBtn);
                            const pre = document.createElement('div');
                            pre.className = 'solution-raw';
                            pre.textContent = fullContent;
                            bubble.appendChild(pre);
                            break;
                        }
                        try {
                            const json = JSON.parse(data);
                            if (json.content) {
                                fullContent += json.content;
                                if (firstChunk) { bubble.classList.remove('loading-dots'); bubble.innerHTML = ''; firstChunk = false; const pre = document.createElement('div'); pre.className = 'solution-raw'; bubble.appendChild(pre); }
                                const pre = bubble.querySelector('.solution-raw');
                                if (pre) pre.textContent = fullContent;
                                solutionContainer.scrollTop = solutionContainer.scrollHeight;
                            } else if (json.error) {
                                bubble.classList.remove('loading-dots');
                                bubble.innerHTML = '<span style="color:red;">修正失败: ' + json.error + '</span>';
                            }
                        } catch (e) {}
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    bubble.classList.remove('loading-dots');
                    if (fullContent) {
                        bubble.innerHTML = '';
                        const pre = document.createElement('div');
                        pre.className = 'solution-raw';
                        pre.textContent = fullContent;
                        bubble.appendChild(pre);
                        bubble.innerHTML += '<div style="color:#999; margin-top:10px; font-size:13px;">[已停止生成]</div>';
                    } else {
                        bubble.innerHTML = '<span style="color:#999;">[已停止生成]</span>';
                    }
                } else {
                    bubble.classList.remove('loading-dots');
                    bubble.textContent = '请求失败: ' + err.message;
                }
            } finally {
                clearTimeout(timeoutId);
                isSolutionSending = false;
                solutionSendBtn.disabled = false;
                solutionStopBtn.style.display = 'none';
                solutionController = null;
                solutionInput.focus();
            }
        }

        solutionSendBtn.addEventListener('click', sendSolution);
        solutionStopBtn.addEventListener('click', () => { if (solutionController) solutionController.abort(); });
        solutionClearBtn.addEventListener('click', async () => {
            if (!confirm('确定要清空修正记录吗？')) return;
            try {
                await fetch('/clear_solution', { method: 'POST' });
                solutionContainer.innerHTML = '';
                addSolutionMessage('assistant', '修正记录已清空，可以开始新的修正。');
            } catch (e) { alert('清空失败'); }
        });

        addSolutionMessage('assistant', '请将你的题解草稿粘贴到下方输入框，AI 将根据洛谷官方规范为你修正格式，并直接返回 Markdown 源码（不渲染），方便你复制到洛谷。');
    </script>
</body>
</html>
